[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/enrich",
    "crates/ipc",
    "crates/store",
    "crates/win-capture",
    "crates/win-firewall",
    "crates/win-pipe",
    "crates/win-secrets",
    "service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Razni-Ahamed/Whereabouts"
authors = ["Whereabouts contributors"]
publish = false

[workspace.dependencies]
whereabouts-core = { path = "crates/core" }
whereabouts-enrich = { path = "crates/enrich" }
whereabouts-ipc = { path = "crates/ipc" }
whereabouts-store = { path = "crates/store" }
whereabouts-win-capture = { path = "crates/win-capture" }
whereabouts-win-firewall = { path = "crates/win-firewall" }
whereabouts-win-pipe = { path = "crates/win-pipe" }
whereabouts-win-secrets = { path = "crates/win-secrets" }

# Third-party
ferrisetw = "1.2"
maxminddb = "0.33"
psl = "2"
# SQLCipher (encrypted SQLite) with OpenSSL built from source. Building it
# needs a native Windows Perl (Strawberry Perl); see CONTRIBUTING.md.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
windows = "0.62"
windows-service = "0.8.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1

# Hashing large program files (hundreds of MB) is dozens of times slower
# without optimisation, so optimise the hashing crate even in dev builds.
[profile.dev.package.sha2]
opt-level = 3
