[workspace]
resolver = "3"
members = [
    "crates/client",
    "crates/core",
    "crates/data-bundle",
    "crates/detect",
    "crates/enrich",
    "crates/ipc",
    "crates/lab-replay",
    "crates/store",
    "crates/win-capture",
    "crates/win-firewall",
    "crates/win-pipe",
    "crates/win-secrets",
    "crates/win-startup",
    "service",
    "ui/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Razni-Ahamed/Whereabouts"
authors = ["Whereabouts contributors"]
publish = false

[workspace.dependencies]
whereabouts-client = { path = "crates/client" }
whereabouts-core = { path = "crates/core" }
whereabouts-data-bundle = { path = "crates/data-bundle" }
whereabouts-detect = { path = "crates/detect" }
whereabouts-enrich = { path = "crates/enrich" }
whereabouts-ipc = { path = "crates/ipc" }
whereabouts-store = { path = "crates/store" }
whereabouts-win-capture = { path = "crates/win-capture" }
whereabouts-win-firewall = { path = "crates/win-firewall" }
whereabouts-win-pipe = { path = "crates/win-pipe" }
whereabouts-win-secrets = { path = "crates/win-secrets" }
whereabouts-win-startup = { path = "crates/win-startup" }

# Third-party
# Ed25519 signatures on data updates (BSD-3-Clause).
ed25519-dalek = "3.0.0"
ferrisetw = "1.2"
getrandom = "0.3"
maxminddb = "0.33"
psl = "2"
# SQLCipher (encrypted SQLite) with OpenSSL built from source. Building it
# needs a native Windows Perl (Strawberry Perl); see CONTRIBUTING.md.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = "2.11.6"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
# HTTPS downloads of list updates, using Windows' own TLS and certificate store.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
windows = "0.62"
windows-service = "0.8.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1

# Hashing large program files (hundreds of MB) is dozens of times slower
# without optimisation, so optimise the hashing crate even in dev builds.
[profile.dev.package.sha2]
opt-level = 3
