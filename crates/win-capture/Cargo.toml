[package]
name = "whereabouts-win-capture"
description = "Windows ETW and WFP event capture for Whereabouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
whereabouts-core.workspace = true
ferrisetw.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Lets a live test write fake ETW events, to check they are rejected.
windows = { workspace = true, features = ["Win32_System_Diagnostics_Etw"] }

[lints]
workspace = true
