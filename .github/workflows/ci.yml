name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # SQLCipher's OpenSSL is built from source and needs a native Windows
  # Perl; GitHub's Windows runners have Strawberry Perl installed here.
  OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe

jobs:
  check:
    name: Format, lint and test (Windows)
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The desktop app embeds the built web UI when it is compiled, so the
      # UI is checked and built before any Rust compilation.
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Check the UI (Svelte and TypeScript)
        working-directory: ui
        run: npm run check
      - name: Test the UI
        working-directory: ui
        run: npm test
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Lab tests (Python)
        run: uv run --project lab --frozen pytest -q lab/tests
      - name: Build the UI
        working-directory: ui
        run: npm run build
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  live:
    # Runs the ETW integration tests that are #[ignore]d locally. GitHub's
    # Windows runners have administrator rights, which ETW needs.
    name: Live ETW tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Live ETW tests
        run: cargo test -p whereabouts-win-capture --test live_capture -- --ignored --test-threads=1
      - name: Reading Windows' DNS cache
        run: cargo test -p whereabouts-win-capture --lib dns_cache -- --ignored
      - name: Live blocking tests (test scope and a copy of curl only)
        run: cargo test -p whereabouts-win-firewall --test live_block -- --ignored --test-threads=1
      - name: Blocking end to end (engine, command line and a copy of curl)
        run: |
          cargo build -p whereabouts-service
          ./scripts/blocking-e2e.ps1
      - name: Download offline data
        shell: pwsh
        run: ./scripts/update-data.ps1
      - name: Enrichment tests against real data
        run: cargo test -p whereabouts-enrich --test real_data
